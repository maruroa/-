const storage = {
  get: async (key, _unused) => {
    try {
      const value = localStorage.getItem(key);
      return value != null ? { value } : null;
    } catch {
      return null;
    }
  },
  set: async (key, value, _unused) => {
    try {
      localStorage.setItem(key, value);
    } catch (e) {
      console.warn("storage set failed", e);
    }
  },
};

function buildDefaultSelected() {
  const obj = {};
  NORMAL_CHARACTERS.forEach((c) => { obj[c.name] = true; });
  SPECIAL_CHARACTERS.forEach((c) => { obj[c.name] = false; });
  return obj;
}

function buildDefaultMustSelected() {
  const obj = {};
  ALL_CHARACTERS.forEach((c) => { obj[c.name] = false; });
  return obj;
}

function getSelectionAccent(map, mode) {
  // mode: "pool" = 抽選対象, "must" = 必ず出す
  const on = ALL_CHARACTERS.filter((c) => map[c.name]);
  if (mode === "must") {
    if (on.length === 0) return null;
  } else {
    const def = buildDefaultSelected();
    const isDefault = ALL_CHARACTERS.every((c) => !!map[c.name] === !!def[c.name]);
    if (isDefault) return null;
  }
  if (on.length === 1) {
    return CHARACTER_COLORS[on[0].name] || "#4D8DFF";
  }
  // 特定ユニットのキャラだけが選ばれているか
  for (const unit of UNITS) {
    const set = new Set(unit.members);
    if (on.length > 0 && on.every((c) => set.has(c.name))) {
      return CHARACTER_COLORS[unit.repChar] || "#4D8DFF";
    }
  }
  // スペシャルのみ
  const specialSet = new Set(SPECIAL_CHARACTERS.map((c) => c.name));
  if (on.length > 0 && on.every((c) => specialSet.has(c.name))) {
    return CHARACTER_COLORS[on[0].name] || "#4D8DFF";
  }
  return "#4D8DFF";
}

function hexToRgb(hex) {
  const h = hex.replace("#", "");
  return { r: parseInt(h.substring(0, 2), 16), g: parseInt(h.substring(2, 4), 16), b: parseInt(h.substring(4, 6), 16) };
}
function mix(hex, target, amount) {
  const c = hexToRgb(hex);
  const t = hexToRgb(target);
  const r = Math.round(c.r + (t.r - c.r) * amount);
  const g = Math.round(c.g + (t.g - c.g) * amount);
  const b = Math.round(c.b + (t.b - c.b) * amount);
  return `rgb(${r}, ${g}, ${b})`;
}
function textColorFor(hex) {
  const { r, g, b } = hexToRgb(hex);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.62 ? "#2B2740" : "#FFFFFF";
}
function hueFor(name) {
  const base = CHARACTER_COLORS[name] || "#4D8DFF";
  return { base, light: mix(base, "#FFFFFF", 0.28) };
}
function chipGridStyle(index, total) {
  const remainder = total % 3;
  if (remainder === 0) return {};
  const lastRowStart = total - remainder;
  if (index < lastRowStart) return {};
  const posInRow = index - lastRowStart;
  if (remainder === 2) return { gridColumn: posInRow === 0 ? "2" : "3" };
  return { gridColumn: "2" };
}

function formatDateTime(ts) {
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  const h = String(d.getHours()).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");
  const s = String(d.getSeconds()).padStart(2, "0");
  return `${y}/${m}/${day} ${h}:${min}:${s}`;
}

function makeUniqueName(baseName, existingNames) {
  const names = new Set(existingNames);
  if (!names.has(baseName)) return baseName;
  let n = 1;
  while (names.has(`${baseName} ${n}`)) n++;
  return `${baseName} ${n}`;
}

function CharacterChip({ name, checked, onToggle, style }) {
  const hue = hueFor(name);
  const textColor = textColorFor(hue.base);
  const chipBg = textColor === "#FFFFFF" ? "rgba(255,255,255,0.28)" : "rgba(43,39,64,0.14)";
  return (
    <button
      type="button"
      role="checkbox"
      aria-checked={checked}
      onClick={onToggle}
      style={{
        ...styles.chip,
        ...style,
        background: `linear-gradient(150deg, ${hue.light}, ${hue.base})`,
        opacity: checked ? 1 : 0.42,
        filter: checked ? "none" : "grayscale(45%)",
      }}
    >
      <span style={{ ...styles.chipCheck, background: chipBg, color: textColor }}>
        {checked && <Check size={14} strokeWidth={4} />}
      </span>
      <span style={{ ...styles.chipName, color: textColor }} className="psk-font-display">
        {name}
      </span>
    </button>
  );
}

function CheckboxRow({ label, checked, onChange, bold }) {
  return (
    <button type="button" role="checkbox" aria-checked={checked} onClick={onChange} style={styles.checkboxRow}>
      <span style={{ ...styles.checkboxBox, ...(checked ? styles.checkboxBoxChecked : {}) }}>
        {checked && <Check size={16} strokeWidth={3.5} color="#4D8DFF" />}
      </span>
      <span style={{ ...styles.checkboxLabel, fontWeight: bold ? 800 : 500 }}>{label}</span>
    </button>
  );
}

function ResultChips({ results }) {
  return (
    <div style={styles.resultsGrid}>
      {results.map((r, idx) => {
        const hue = hueFor(r.name);
        const textColor = textColorFor(hue.base);
        const chipBg = textColor === "#FFFFFF" ? "rgba(255,255,255,0.22)" : "rgba(43,39,64,0.12)";
        return (
          <div
            key={r.uid || `${r.name}-${idx}`}
            className="result-card"
            style={{
              ...styles.resultCard,
              animationDelay: `${idx * 0.06}s`,
              background: `linear-gradient(150deg, ${hue.light}, ${hue.base})`,
              color: textColor,
            }}
          >
            <div style={styles.resultCardTop}>
              <span style={{ ...styles.resultOrder, background: chipBg, color: textColor }} className="psk-font-display">
                {String(r.order).padStart(2, "0")}
              </span>
              {r.special && (
                <span style={{ ...styles.specialBadge, background: chipBg, color: textColor }}>ERROR</span>
              )}
            </div>
            <div style={styles.resultCardBody}>
              <div style={{ ...styles.resultName, color: textColor }} className="psk-font-display">
                {r.name}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function App() {
  const [count, setCount] = useState(5);
  const [duplicateOn, setDuplicateOn] = useState(false);
  const [selected, setSelected] = useState(buildDefaultSelected);
  const [mustSelected, setMustSelected] = useState(buildDefaultMustSelected);
  const [draftSelected, setDraftSelected] = useState(null);
  const [draftMustSelected, setDraftMustSelected] = useState(null);
  const [showCharModal, setShowCharModal] = useState(false);
  const [showMustModal, setShowMustModal] = useState(false);
  const [showHistoryModal, setShowHistoryModal] = useState(false);
  const [historyTab, setHistoryTab] = useState("recent"); // "recent" | "favorites"

  // origins / closing for overlays
  const [charOrigin, setCharOrigin] = useState({ x: 50, y: 50 });
  const [charClosing, setCharClosing] = useState(false);
  const [mustOrigin, setMustOrigin] = useState({ x: 50, y: 50 });
  const [mustClosing, setMustClosing] = useState(false);
  const [historyOrigin, setHistoryOrigin] = useState({ x: 50, y: 50 });
  const [historyClosing, setHistoryClosing] = useState(false);
  const [showResultsOverlay, setShowResultsOverlay] = useState(false);
  const [resultsClosing, setResultsClosing] = useState(false);
  const [resultsOrigin, setResultsOrigin] = useState({ x: 50, y: 90 });
  const [showSettingsOverlay, setShowSettingsOverlay] = useState(false);
  const [settingsClosing, setSettingsClosing] = useState(false);
  const [settingsOrigin, setSettingsOrigin] = useState({ left: 0, top: 0, width: 280, openAbove: false });

  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const [showResetAllConfirm, setShowResetAllConfirm] = useState(false);
  const [showSaveModal, setShowSaveModal] = useState(false);
  const [saveNameInput, setSaveNameInput] = useState("");
  const [saveDefaultName, setSaveDefaultName] = useState("");
  const [saveResultDuplicate, setSaveResultDuplicate] = useState(false);
  const [saveNameDuplicate, setSaveNameDuplicate] = useState(false);
  const [renameTarget, setRenameTarget] = useState(null); // favorite object or null
  const [renameInput, setRenameInput] = useState("");
  const [renameNameDuplicate, setRenameNameDuplicate] = useState(false);

  const [results, setResults] = useState(null);
  const [viewingPast, setViewingPast] = useState(false);
  const [error, setError] = useState("");
  const [isDrawing, setIsDrawing] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [history, setHistory] = useState([]);
  const [favorites, setFavorites] = useState([]);
  const [favSortMode, setFavSortMode] = useState("created"); // "name" | "created" | "viewed"
  const [favSortDesc, setFavSortDesc] = useState(true);
  const [dragId, setDragId] = useState(null);
  const [toasts, setToasts] = useState([]);

  const drawBtnRef = useRef(null);
  const settingsBtnRef = useRef(null);
  const charBtnRef = useRef(null);
  const mustBtnRef = useRef(null);
  const historyBtnRef = useRef(null);
  const saveInputRef = useRef(null);
  const renameInputRef = useRef(null);

  const normalPool = NORMAL_CHARACTERS.filter((c) => selected[c.name]);
  const pool = ALL_CHARACTERS.filter((c) => selected[c.name]);
  const mustPool = ALL_CHARACTERS.filter((c) => mustSelected[c.name] && selected[c.name]);
  const mustCount = mustPool.length;

  const forcedDuplicate = pool.length > 0 && count > pool.length;
  const effectiveDuplicateOn = forcedDuplicate || duplicateOn;

  // must-include exceeds count
  const mustExceedsCount = mustCount > count;
  // must-include not in pool
  const mustNotInPool = ALL_CHARACTERS.filter((c) => mustSelected[c.name] && !selected[c.name]);

  const draftAllChecked =
    draftSelected && NORMAL_CHARACTERS.every((c) => draftSelected[c.name]);
  const draftMustAllChecked =
    draftMustSelected && ALL_CHARACTERS.every((c) => draftMustSelected[c.name]);

  const isUnitCheckedIn = (map, unit) => unit.members.every((m) => map[m]);

  const toggleDraftCharacter = (name) => {
    setDraftSelected((prev) => ({ ...prev, [name]: !prev[name] }));
  };
  const toggleDraftUnit = (unit, checked) => {
    setDraftSelected((prev) => {
      const next = { ...prev };
      unit.members.forEach((m) => { next[m] = checked; });
      return next;
    });
  };
  const toggleDraftAll = (checked) => {
    setDraftSelected((prev) => {
      const next = { ...prev };
      NORMAL_CHARACTERS.forEach((c) => { next[c.name] = checked; });
      return next;
    });
  };

  const toggleDraftMustCharacter = (name) => {
    setDraftMustSelected((prev) => ({ ...prev, [name]: !prev[name] }));
  };
  const toggleDraftMustUnit = (unit, checked) => {
    setDraftMustSelected((prev) => {
      const next = { ...prev };
      unit.members.forEach((m) => { next[m] = checked; });
      return next;
    });
  };
  const toggleDraftMustAll = (checked) => {
    setDraftMustSelected((prev) => {
      const next = { ...prev };
      ALL_CHARACTERS.forEach((c) => { next[c.name] = checked; });
      return next;
    });
  };

  const captureOrigin = (ref) => {
    if (!ref || !ref.current || typeof window === "undefined") return { x: 50, y: 50 };
    const rect = ref.current.getBoundingClientRect();
    return {
      x: ((rect.left + rect.width / 2) / window.innerWidth) * 100,
      y: ((rect.top + rect.height / 2) / window.innerHeight) * 100,
    };
  };
  const captureOriginFromEvent = (e) => {
    if (!e || !e.currentTarget || typeof window === "undefined") return { x: 50, y: 50 };
    const rect = e.currentTarget.getBoundingClientRect();
    return {
      x: ((rect.left + rect.width / 2) / window.innerWidth) * 100,
      y: ((rect.top + rect.height / 2) / window.innerHeight) * 100,
    };
  };

  const showToast = useCallback((message) => {
    const id = `t-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    setToasts((prev) => [...prev, { id, message }]);
    setTimeout(() => {
      setToasts((prev) => prev.filter((t) => t.id !== id));
    }, 2400);
  }, []);


  // ---- 抽選キャラクター モーダル ----
  const openCharModal = () => {
    setCharOrigin(captureOrigin(charBtnRef));
    setDraftSelected({ ...selected });
    setCharClosing(false);
    setShowCharModal(true);
  };
  const closeCharModalAnimated = (commit) => {
    setCharClosing(true);
    setTimeout(() => {
      setShowCharModal(false);
      setCharClosing(false);
      if (commit) setSelected(draftSelected);
      setDraftSelected(null);
    }, OVERLAY_CLOSE_MS);
  };
  const confirmCharModal = () => {
    closeCharModalAnimated(true);
    showToast("抽選キャラクターを更新しました");
  };
  const cancelCharModal = () => closeCharModalAnimated(false);

  // ---- 必ず出すキャラ モーダル ----
  const openMustModal = () => {
    setMustOrigin(captureOrigin(mustBtnRef));
    setDraftMustSelected({ ...mustSelected });
    setMustClosing(false);
    setShowMustModal(true);
  };
  const closeMustModalAnimated = (commit) => {
    setMustClosing(true);
    setTimeout(() => {
      setShowMustModal(false);
      setMustClosing(false);
      if (commit) setMustSelected(draftMustSelected);
      setDraftMustSelected(null);
    }, OVERLAY_CLOSE_MS);
  };
  const confirmMustModal = () => {
    closeMustModalAnimated(true);
    showToast("必ず出すキャラを更新しました");
  };
  const cancelMustModal = () => closeMustModalAnimated(false);

  const handleDuplicateToggle = () => {
    if (forcedDuplicate) return;
    setDuplicateOn((d) => {
      const next = !d;
      showToast(next ? "重複を許可しました" : "重複をオフにしました");
      return next;
    });
  };

  // ---- 読み込み（永続）----
  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          if (typeof saved.count === "number" && saved.count >= 1) setCount(saved.count);
          if (typeof saved.duplicateOn === "boolean") setDuplicateOn(saved.duplicateOn);
          if (saved.selected && typeof saved.selected === "object") {
            const merged = buildDefaultSelected();
            Object.keys(merged).forEach((name) => {
              if (typeof saved.selected[name] === "boolean") merged[name] = saved.selected[name];
            });
            setSelected(merged);
          }
          if (saved.mustSelected && typeof saved.mustSelected === "object") {
            const mergedMust = buildDefaultMustSelected();
            Object.keys(mergedMust).forEach((name) => {
              if (typeof saved.mustSelected[name] === "boolean") mergedMust[name] = saved.mustSelected[name];
            });
            setMustSelected(mergedMust);
          }
          if (Array.isArray(saved.history)) {
            setHistory(
              saved.history.slice(0, HISTORY_LIMIT).map((h) => ({
                ...h,
                name: h.name || formatDateTime(h.ts || Date.now()),
              }))
            );
          }
          if (Array.isArray(saved.favorites)) {
            setFavorites(
              saved.favorites.map((f, i) => ({
                ...f,
                createdAt: typeof f.createdAt === "number" ? f.createdAt : (f.ts || Date.now()),
                lastViewedAt: typeof f.lastViewedAt === "number" ? f.lastViewedAt : (f.createdAt || f.ts || Date.now()),
                order: typeof f.order === "number" ? f.order : i,
              }))
            );
          }
          if (saved.favSortMode === "name" || saved.favSortMode === "created" || saved.favSortMode === "viewed") {
            setFavSortMode(saved.favSortMode);
          }
          if (typeof saved.favSortDesc === "boolean") setFavSortDesc(saved.favSortDesc);
        }
      } catch (e) {
        // default
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  // ---- 保存（永続）----
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        await storage.set(
          STORAGE_KEY,
          JSON.stringify({
            count,
            duplicateOn,
            selected,
            mustSelected,
            history,
            favorites,
            favSortMode,
            favSortDesc,
          }),
          false
        );
      } catch (e) {}
    })();
  }, [count, duplicateOn, selected, mustSelected, history, favorites, favSortMode, favSortDesc, loaded]);

  const mustNotInPoolKey = mustNotInPool.map((c) => c.name).join("|");
  useEffect(() => {
    if (pool.length === 0) {
      setError("抽選対象キャラクターが1人もいません。キャラクターを選択してください。");
    } else if (mustNotInPool.length > 0) {
      setError(`必ず出すキャラクターのうち、抽選対象外のキャラクターがあります（${mustNotInPool.map((c) => c.name).join("、")}）。抽選対象に含めるか、必ず出す設定を外してください。`);
    } else if (mustExceedsCount) {
      setError(`必ず出すキャラクターが${mustCount}人いますが、抽選人数が${count}人です。人数を増やすか、必ず出すキャラクターを減らしてください。`);
    } else if (!effectiveDuplicateOn && count > pool.length) {
      setError(`抽選人数が抽選対象のキャラクター数（${pool.length}人）を超えています。人数を減らすか、重複を許可してください。`);
    } else {
      setError("");
    }
  }, [count, pool.length, mustCount, mustExceedsCount, mustNotInPoolKey, effectiveDuplicateOn]);

  useEffect(() => {
    if (showSaveModal) {
      setTimeout(() => saveInputRef.current?.focus(), 50);
    }
  }, [showSaveModal]);

  useEffect(() => {
    if (renameTarget) {
      setTimeout(() => renameInputRef.current?.focus(), 50);
    }
  }, [renameTarget]);

  const adjustCount = (delta) => setCount((c) => Math.max(1, Math.min(999, c + delta)));
  const handleCountInput = (val) => {
    const n = parseInt(val, 10);
    setCount(isNaN(n) ? 1 : Math.max(1, Math.min(999, n)));
  };

  const draw = useCallback(() => {
    if (pool.length === 0) {
      setError("抽選対象キャラクターが1人もいません。キャラクターを選択してください。");
      setResults(null);
      return;
    }
    if (mustNotInPool.length > 0) {
      setError(`必ず出すキャラクターのうち、抽選対象外のキャラクターがあります（${mustNotInPool.map((c) => c.name).join("、")}）。抽選対象に含めるか、必ず出す設定を外してください。`);
      setResults(null);
      return;
    }
    if (mustExceedsCount) {
      setError(`必ず出すキャラクターが${mustCount}人いますが、抽選人数が${count}人です。人数を増やすか、必ず出すキャラクターを減らしてください。`);
      setResults(null);
      return;
    }
    if (!effectiveDuplicateOn && count > pool.length) {
      setError(`抽選人数が抽選対象のキャラクター数（${pool.length}人）を超えています。人数を減らすか、重複を許可してください。`);
      setResults(null);
      return;
    }
    setError("");
    setIsDrawing(true);

    let picked = [];
    const forced = [...mustPool];

    if (effectiveDuplicateOn) {
      // include all forced first
      picked = [...forced];
      while (picked.length < count) {
        picked.push(pool[Math.floor(Math.random() * pool.length)]);
      }
      // shuffle so forced are not always at front
      for (let i = picked.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [picked[i], picked[j]] = [picked[j], picked[i]];
      }
    } else {
      // no duplicates
      const remaining = pool.filter((c) => !forced.some((f) => f.name === c.name));
      const shuffled = [...remaining];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      const need = count - forced.length;
      picked = [...forced, ...shuffled.slice(0, need)];
      // shuffle final order
      for (let i = picked.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [picked[i], picked[j]] = [picked[j], picked[i]];
      }
    }

    setTimeout(() => {
      const now = Date.now();
      const withOrder = picked.map((c, i) => ({ ...c, order: i + 1, uid: `${c.id}-${i}-${now}` }));
      setResults(withOrder);
      setViewingPast(false);
      setIsDrawing(false);
      setResultsClosing(false);
      setSaveResultDuplicate(false);
      setSaveNameDuplicate(false);
      setShowResultsOverlay(true);
      setHistory((prev) => {
        const entry = {
          id: `h-${now}`,
          results: withOrder,
          ts: now,
          name: formatDateTime(now),
        };
        return [entry, ...prev].slice(0, HISTORY_LIMIT);
      });
    }, 650);
  }, [count, effectiveDuplicateOn, pool, mustPool, mustCount, mustExceedsCount, mustNotInPool]);

  const handleDrawClick = () => {
    setResultsOrigin(captureOrigin(drawBtnRef));
    draw();
  };

  const openPastResult = (item, e, isFavorite = false) => {
    setResultsOrigin(captureOriginFromEvent(e));
    setResults(item.results);
    setViewingPast(true);
    setResultsClosing(false);
    setSaveResultDuplicate(false);
    setSaveNameDuplicate(false);
    setShowResultsOverlay(true);
    if (isFavorite && item.id) {
      // update lastViewedAt
      setFavorites((prev) =>
        prev.map((f) =>
          f.id === item.id ? { ...f, lastViewedAt: Date.now() } : f
        )
      );
    }
  };

  const closeResultsOverlay = () => {
    setResultsClosing(true);
    setTimeout(() => {
      setShowResultsOverlay(false);
      setResultsClosing(false);
      setResults(null);
      setViewingPast(false);
      setSaveResultDuplicate(false);
      setSaveNameDuplicate(false);
    }, OVERLAY_CLOSE_MS);
  };

  const areResultsEqual = (a, b) => {
    if (!a || !b || a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
      if (a[i].name !== b[i].name) return false;
    }
    return true;
  };

  const openSaveModal = () => {
    if (!results) return;
    const isDupResult = favorites.some((f) => areResultsEqual(f.results, results));
    setSaveResultDuplicate(isDupResult);
    setSaveNameDuplicate(false);
    const defaultName = formatDateTime(Date.now());
    setSaveDefaultName(defaultName);
    setSaveNameInput(""); // 空欄＋プレースホルダーで日付を表示
    setShowSaveModal(true);
  };
  const cancelSaveModal = () => {
    setShowSaveModal(false);
    setSaveNameInput("");
    setSaveDefaultName("");
    setSaveResultDuplicate(false);
    setSaveNameDuplicate(false);
  };
  const confirmSaveFavorite = () => {
    let trimmed = saveNameInput.trim() || saveDefaultName.trim();
    if (!trimmed || !results) return;
    const existingNames = favorites.map((f) => f.name);
    const isNameDup = existingNames.includes(trimmed);
    if (isNameDup) {
      // auto number
      trimmed = makeUniqueName(trimmed, existingNames);
    }
    const now = Date.now();
    setFavorites((prev) => [
      ...prev,
      {
        id: `fav-${now}`,
        name: trimmed,
        results,
        createdAt: now,
        lastViewedAt: now,
        order: prev.length,
      },
    ]);
    setShowSaveModal(false);
    setSaveNameInput("");
    setSaveDefaultName("");
    setSaveResultDuplicate(false);
    setSaveNameDuplicate(false);
    showToast(`「${trimmed}」を保存しました`);
  };

  // live check name duplicate while typing
  const handleSaveNameChange = (val) => {
    setSaveNameInput(val);
    const t = val.trim();
    setSaveNameDuplicate(t !== "" && favorites.some((f) => f.name === t));
  };

  const deleteHistory = (id) => {
    setHistory((prev) => prev.filter((h) => h.id !== id));
    showToast("履歴を削除しました");
  };

  const deleteFavorite = (id) => {
    setFavorites((prev) =>
      prev.filter((f) => f.id !== id).map((f, i) => ({ ...f, order: i }))
    );
    showToast("お気に入りを削除しました");
  };

  // ---- rename ----
  const openRename = (fav) => {
    setRenameTarget(fav);
    setRenameInput(fav.name);
    setRenameNameDuplicate(false);
  };
  const cancelRename = () => {
    setRenameTarget(null);
    setRenameInput("");
    setRenameNameDuplicate(false);
  };
  const confirmRename = () => {
    if (!renameTarget) return;
    let trimmed = renameInput.trim();
    if (!trimmed) return;
    const otherNames = favorites.filter((f) => f.id !== renameTarget.id).map((f) => f.name);
    if (otherNames.includes(trimmed)) {
      trimmed = makeUniqueName(trimmed, otherNames);
    }
    setFavorites((prev) =>
      prev.map((f) => (f.id === renameTarget.id ? { ...f, name: trimmed } : f))
    );
    setRenameTarget(null);
    setRenameInput("");
    setRenameNameDuplicate(false);
    showToast("名前を変更しました");
  };
  const handleRenameInputChange = (val) => {
    setRenameInput(val);
    const t = val.trim();
    setRenameNameDuplicate(
      t !== "" &&
        favorites.some((f) => f.id !== renameTarget?.id && f.name === t)
    );
  };

  // ---- 履歴・お気に入り オーバーレイ ----
  const openHistoryModal = () => {
    setHistoryOrigin(captureOrigin(historyBtnRef));
    setHistoryClosing(false);
    setShowHistoryModal(true);
  };
  const closeHistoryModal = () => {
    setHistoryClosing(true);
    setTimeout(() => {
      setShowHistoryModal(false);
      setHistoryClosing(false);
    }, OVERLAY_CLOSE_MS);
  };

  // ---- 設定パネル ----
  const openSettingsOverlay = () => {
    if (!settingsBtnRef.current || typeof window === "undefined") {
      setSettingsClosing(false);
      setShowSettingsOverlay(true);
      return;
    }
    const rect = settingsBtnRef.current.getBoundingClientRect();
    const panelWidth = Math.min(300, window.innerWidth - 24);
    const estHeight = forcedDuplicate ? 220 : 168;
    let left = rect.left + rect.width / 2 - panelWidth / 2;
    left = Math.max(12, Math.min(left, window.innerWidth - panelWidth - 12));
    let openAbove = false;
    let top = rect.bottom + 10;
    if (top + estHeight > window.innerHeight - 12) {
      openAbove = true;
      top = Math.max(12, rect.top - estHeight - 10);
    }
    setSettingsOrigin({ left, top, width: panelWidth, openAbove });
    setSettingsClosing(false);
    setShowSettingsOverlay(true);
  };
  const closeSettingsOverlay = () => {
    setSettingsClosing(true);
    setTimeout(() => {
      setShowSettingsOverlay(false);
      setSettingsClosing(false);
    }, OVERLAY_CLOSE_MS);
  };

  const openResetConfirm = () => setShowResetConfirm(true);
  const cancelResetConfirm = () => setShowResetConfirm(false);

  const performResetAll = () => {
    setCount(5);
    setDuplicateOn(false);
    setSelected(buildDefaultSelected());
    setMustSelected(buildDefaultMustSelected());
    setHistory([]);
    setFavorites([]);
    setFavSortMode("created");
    setFavSortDesc(true);
    setShowResetConfirm(false);
    setShowResetAllConfirm(false);
    showToast("すべてリセットしました");
  };

  const performResetExceptHistory = () => {
    setCount(5);
    setDuplicateOn(false);
    setSelected(buildDefaultSelected());
    setMustSelected(buildDefaultMustSelected());
    // history & favorites untouched
    setShowResetConfirm(false);
    showToast("設定をリセットしました（履歴・お気に入りは残しています）");
  };

  // ---- お気に入り並べ替え（ポインタドラッグは残しつつ、ソートUIも追加） ----
  const handleFavPointerDown = (e, id) => {
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    setDragId(id);
  };
  const handleFavPointerMove = (e) => {
    if (!dragId) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const target = el && el.closest("[data-fav-id]");
    if (!target) return;
    const overId = target.getAttribute("data-fav-id");
    if (!overId || overId === dragId) return;
    setFavorites((prev) => {
      const arr = [...prev];
      const from = arr.findIndex((f) => f.id === dragId);
      const to = arr.findIndex((f) => f.id === overId);
      if (from === -1 || to === -1) return prev;
      const [moved] = arr.splice(from, 1);
      arr.splice(to, 0, moved);
      return arr.map((f, i) => ({ ...f, order: i }));
    });
  };
  const handleFavPointerUp = () => setDragId(null);

  const sortedFavorites = [...favorites].sort((a, b) => {
    let cmp = 0;
    if (favSortMode === "name") {
      cmp = (a.name || "").localeCompare(b.name || "", "ja");
    } else if (favSortMode === "created") {
      cmp = (a.createdAt || 0) - (b.createdAt || 0);
    } else {
      // viewed
      cmp = (a.lastViewedAt || 0) - (b.lastViewedAt || 0);
    }
    return favSortDesc ? -cmp : cmp;
  });

  const mustActiveCount = Object.values(mustSelected).filter(Boolean).length;
  const poolSelectedCount = ALL_CHARACTERS.filter((c) => selected[c.name]).length;
  const poolAccent = getSelectionAccent(selected, "pool");
  const mustAccent = getSelectionAccent(mustSelected, "must");
  const drawBlocked =
    isDrawing ||
    pool.length === 0 ||

        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }

      <div style={styles.bubbleA} className="float-bubble" />
      <div style={styles.bubbleB} className="float-bubble" />
      <div style={styles.bubbleC} className="float-bubble" />

      <div style={styles.container}>
        <header style={styles.header}>
          <div style={styles.logoPlate} className="psk-font-display">
            <Sparkles size={16} className="sparkle-icon" style={{ marginRight: 6, color: "#FFD23F" }} />

          </div>
          <h1 className="psk-font-display" style={styles.title}>
            プロセカキャラクター<span style={styles.titleAccent}>抽選</span>
          </h1>
          <div style={styles.eqRow} aria-hidden="true">
            {[0.4, 0.9, 0.6, 1, 0.5, 0.8, 0.3].map((h, i) => (
              <span key={i} className="eq-bar" style={{ ...styles.eqBar, height: `${h * 18 + 6}px`, animationDelay: `${i * 0.09}s`, background: EQ_COLORS[i % EQ_COLORS.length] }} />
            ))}
          </div>
          <p className="psk-font-body" style={styles.subtitle}>人数と条件を選んで、メンバーを抽選しよう</p>
        </header>

        <section style={styles.card} className="psk-font-body">
          <div style={styles.cardLabelRow}>
            <span style={styles.cardLabel}><span style={styles.cardLabelDot} />抽選人数</span>
            <span style={styles.cardLabelHint}>{effectiveDuplicateOn ? "重複あり" : `最大 ${pool.length} 人（重複なし）`}</span>
          </div>
          <div style={styles.stepperRow}>
            <button type="button" onClick={() => adjustCount(-1)} style={styles.stepperBtn} className="stepper-btn" aria-label="人数を減らす">

            <div style={styles.stepperInputWrap}>
              <input type="number" inputMode="numeric" value={count} min={1} onChange={(e) => handleCountInput(e.target.value)} style={styles.stepperInput} className="psk-font-display" aria-label="抽選人数" />

            </div>
            <button type="button" onClick={() => adjustCount(1)} style={styles.stepperBtn} className="stepper-btn" aria-label="人数を増やす">
              <Plus size={22} strokeWidth={3} />
            </button>
          </div>
          <div style={styles.quickRow}>
            {[1, 2, 3, 4, 5, 6].map((n) => (
              <button key={n} type="button" onClick={() => setCount(n)} className="quick-btn" style={{ ...styles.quickBtn, ...(count === n ? styles.quickBtnActive : {}) }}>
                {n}人
              </button>

          </div>
          <div style={styles.poolInfo}>
            現在の抽選対象：<b>{pool.length}人</b>
            {mustActiveCount > 0 && (
              <span style={{ marginLeft: 8, color: "#4D8DFF" }}>／ 必ず出す：{mustActiveCount}人</span>
            )}
          </div>

          {/* 5つのアイコンボタン */}
          <div style={styles.iconRow}>
            <button
              type="button"
              ref={charBtnRef}
              className="icon-btn"
              onClick={openCharModal}
              style={accentButtonStyle(styles.iconBtn, poolAccent)}

            <button

              <CheckboxRow label="全員" checked={!!draftAllChecked} onChange={() => toggleDraftAll(!draftAllChecked)} bold />

                const unitChecked = isUnitCheckedIn(draftSelected, unit);
                const hue = hueFor(unit.repChar);
                const textColor = textColorFor(hue.base);
                const chipBg = textColor === "#FFFFFF" ? "rgba(255,255,255,0.25)" : "rgba(43,39,64,0.12)";

                      role="checkbox"

                      <span style={{
                        ...styles.checkboxBox,
                        background: unitChecked ? "rgba(255,255,255,0.92)" : chipBg,
                        border: unitChecked ? "2px solid rgba(255,255,255,0.95)" : "2px solid transparent",

                        {unitChecked && <Check size={17} strokeWidth={4} color="#2B2740" />}

                      <span style={{ ...styles.unitHeaderLabel, color: textColor }} className="psk-font-display">{unit.label}</span>

                    <div style={styles.chipGrid}>
                      {unit.members.map((name, i) => (
                        <CharacterChip key={name} name={name} checked={!!draftSelected[name]} onToggle={() => toggleDraftCharacter(name)} style={chipGridStyle(i, unit.members.length)} />
                      ))}
                    </div>
                  </div>
                );
              })}
              <div style={styles.specialDivider} />
              <div style={styles.chipGrid}>
                {SPECIAL_CHARACTERS.map((c, i) => (
                  <CharacterChip key={c.name} name={c.name} checked={!!draftSelected[c.name]} onToggle={() => toggleDraftCharacter(c.name)} style={chipGridStyle(i, SPECIAL_CHARACTERS.length)} />
                ))}
              </div>
            </div>
          </div>
          </div>
          <button type="button" onClick={cancelCharModal} style={{ ...styles.overlayFloatBtn, left: "20px" }} aria-label="キャンセル">
            <X size={24} color="#E1435F" />
          </button>
          <button type="button" onClick={confirmCharModal} style={{ ...styles.overlayFloatBtn, right: "20px" }} aria-label="決定">
            <Check size={24} color="#2FBE84" strokeWidth={3} />
          </button>
        </div>
      )}

      {/* 必ず出すキャラ オーバーレイ */}
      {showMustModal && draftMustSelected && (
        <div
          className={mustClosing ? "shrink-panel" : "grow-panel"}
          style={{ ...styles.fullOverlayPanel, transformOrigin: `${mustOrigin.x}% ${mustOrigin.y}%` }}
        >
          <div style={styles.overlayScrollArea}>
          <div style={styles.fullOverlayInner} className="psk-font-body">
            <div style={styles.overlayTitleRow}>
              <span className="psk-font-display" style={styles.overlayTitle}>必ず出すキャラ</span>
            </div>
            <div style={{ fontSize: "12px", color: "#6B6685", textAlign: "center", marginBottom: 12, lineHeight: 1.5 }}>
              ONにしたキャラクターは抽選結果に必ず含まれます
            </div>
            <div style={styles.overlayScrollBody}>
              <CheckboxRow label="全員" checked={!!draftMustAllChecked} onChange={() => toggleDraftMustAll(!draftMustAllChecked)} bold />
              {UNITS.map((unit) => {
                const unitChecked = isUnitCheckedIn(draftMustSelected, unit);
                const hue = hueFor(unit.repChar);
                const textColor = textColorFor(hue.base);
                const chipBg = textColor === "#FFFFFF" ? "rgba(255,255,255,0.25)" : "rgba(43,39,64,0.12)";
                return (
                  <div key={unit.id} style={styles.unitBlock}>
                    <button
                      type="button"
                      role="checkbox"
                      aria-checked={unitChecked}
                      onClick={() => toggleDraftMustUnit(unit, !unitChecked)}
                      style={{ ...styles.unitHeaderBar, background: `linear-gradient(120deg, ${hue.light}, ${hue.base})` }}
                    >
                      <span style={{
                        ...styles.checkboxBox,
                        background: unitChecked ? "rgba(255,255,255,0.92)" : chipBg,
                        border: unitChecked ? "2px solid rgba(255,255,255,0.95)" : "2px solid transparent",
                        boxShadow: unitChecked ? "0 1px 4px rgba(0,0,0,0.18)" : "none",
                      }}>
                        {unitChecked && <Check size={17} strokeWidth={4} color="#2B2740" />}
                      </span>
                      <span style={{ ...styles.unitHeaderLabel, color: textColor }} className="psk-font-display">{unit.label}</span>
                    </button>
                    <div style={styles.chipGrid}>
                      {unit.members.map((name, i) => (
                        <CharacterChip key={name} name={name} checked={!!draftMustSelected[name]} onToggle={() => toggleDraftMustCharacter(name)} style={chipGridStyle(i, unit.members.length)} />
                      ))}
                    </div>
                  </div>
                );
              })}
              <div style={styles.specialDivider} />
              <div style={styles.chipGrid}>
                {SPECIAL_CHARACTERS.map((c, i) => (
                  <CharacterChip key={c.name} name={c.name} checked={!!draftMustSelected[c.name]} onToggle={() => toggleDraftMustCharacter(c.name)} style={chipGridStyle(i, SPECIAL_CHARACTERS.length)} />
                ))}
              </div>
            </div>
          </div>
          </div>
          <button type="button" onClick={cancelMustModal} style={{ ...styles.overlayFloatBtn, left: "20px" }} aria-label="キャンセル">
            <X size={24} color="#E1435F" />

          <button type="button" onClick={confirmMustModal} style={{ ...styles.overlayFloatBtn, right: "20px" }} aria-label="決定">
            <Check size={24} color="#2FBE84" strokeWidth={3} />
          </button>
        </div>

      {/* 履歴・お気に入り オーバーレイ（タブ分け） */}

        <div

          style={{ ...styles.fullOverlayPanel, transformOrigin: `${historyOrigin.x}% ${historyOrigin.y}%` }}
        >
          <div style={styles.overlayScrollArea}>
          <div style={styles.fullOverlayInner} className="psk-font-body">
            <div style={styles.overlayTitleRow}>

            </div>

            {/* タブ */}
            <div style={styles.tabRow}>
              <button
                type="button"
                onClick={() => setHistoryTab("recent")}
                style={{ ...styles.tabBtn, ...(historyTab === "recent" ? styles.tabBtnActive : {}) }}

              <button

            <div style={styles.overlayScrollBody}>
              {historyTab === "recent" && (
                <>
                  <div style={styles.modalSectionLabel} className="psk-font-display">直近（最大{HISTORY_LIMIT}件）</div>
                  {history.length === 0 ? (
                    <div style={styles.emptyNote}>まだ履歴がありません</div>

                    <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 18 }}>
                      {history.map((h) => (
                        <div

                          onClick={(e) => openPastResult(h, e, false)}

                          <div style={styles.historyRowTop}>
                            <div style={styles.historyName}>{h.name || formatDateTime(h.ts)}</div>
                            <button
                              type="button"
                              aria-label="この履歴を削除"
                              onClick={(e) => { e.stopPropagation(); deleteHistory(h.id); }}
                              style={styles.historyDeleteBtn}
                            >
                              <Trash2 size={12} />
                            </button>
                          </div>
                          <span style={styles.historyRowText}>{h.results.map((r) => r.name).join("、")}</span>
                        </div>

                    </div>

                </>
              )}

              {historyTab === "favorites" && (
                <>
                  {/* 並べ替えUI */}
                  <div style={styles.sortBar}>
                    <div style={styles.sortModes}>
                      {[
                        { id: "name", label: "名前", icon: ArrowDownAZ },
                        { id: "created", label: "作成日", icon: Calendar },
                        { id: "viewed", label: "閲覧", icon: Eye },
                      ].map((m) => (
                        <button
                          key={m.id}
                          type="button"
                          onClick={() => setFavSortMode(m.id)}
                          style={{
                            ...styles.sortModeBtn,
                            ...(favSortMode === m.id ? styles.sortModeBtnActive : {}),
                          }}
                          className="psk-font-display"
                        >
                          <m.icon size={12} style={{ marginRight: 3 }} />
                          {m.label}
                        </button>
                      ))}
                    </div>
                    <button

                      onClick={() => setFavSortDesc((d) => !d)}
                      style={styles.sortDirBtn}
                      aria-label={favSortDesc ? "降順" : "昇順"}
                      title={favSortDesc ? "降順 → 昇順" : "昇順 → 降順"}
                    >
                      <ArrowUpDown size={16} />
                      <span style={{ fontSize: 10, marginLeft: 2 }}>{favSortDesc ? "↓" : "↑"}</span>
                    </button>
                  </div>

                  {sortedFavorites.length === 0 ? (
                    <div style={styles.emptyNote}>結果画面の「残す」でお気に入りに追加できます</div>
                  ) : (
                    <div style={styles.favGrid}>
                      {sortedFavorites.map((f) => (
                        <div
                          key={f.id}
                          data-fav-id={f.id}
                          className="fav-card"
                          onPointerDown={(e) => handleFavPointerDown(e, f.id)}
                          onPointerMove={handleFavPointerMove}
                          onPointerUp={handleFavPointerUp}
                          onPointerCancel={handleFavPointerUp}
                          onClick={(e) => { if (!dragId) openPastResult(f, e, true); }}
                          style={{
                            ...styles.favCard,
                            opacity: dragId === f.id ? 0.55 : 1,
                            transform: dragId === f.id ? "scale(1.05)" : "scale(1)",
                            boxShadow: dragId === f.id ? "0 12px 22px -8px rgba(43,39,64,0.4)" : styles.favCard.boxShadow,
                          }}
                        >
                          <button
                            type="button"
                            aria-label={`${f.name}を削除`}
                            onPointerDown={(e) => e.stopPropagation()}
                            onClick={(e) => { e.stopPropagation(); deleteFavorite(f.id); }}
                            style={styles.favDeleteBtn}
                          >
                            <Trash2 size={12} />
                          </button>
                          <button
                            type="button"
                            aria-label={`${f.name}の名前を変更`}
                            onPointerDown={(e) => e.stopPropagation()}
                            onClick={(e) => { e.stopPropagation(); openRename(f); }}
                            style={styles.favRenameBtn}
                          >
                            <Pencil size={12} />
                          </button>
                          <Star size={14} color="#FFD23F" fill="#FFD23F" />
                          <span style={styles.favCardName}>{f.name}</span>
                          <span style={styles.favViewed}>
                            閲覧 {formatDateTime(f.lastViewedAt || f.createdAt || Date.now())}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </>
              )}
            </div>
          </div>
          </div>
          <button type="button" onClick={closeHistoryModal} style={styles.overlayCloseBtn} aria-label="閉じる">
            <X size={26} color="#2B2740" strokeWidth={2.5} />
          </button>
        </div>
      )}

      {/* 抽選結果 オーバーレイ */}
      {showResultsOverlay && results && (
        <div
          className={resultsClosing ? "shrink-panel" : "grow-panel"}
          style={{ ...styles.fullOverlayPanel, zIndex: 1400, transformOrigin: `${resultsOrigin.x}% ${resultsOrigin.y}%` }}
        >
          <div style={styles.overlayScrollArea}>
          <div style={styles.fullOverlayInner} className="psk-font-body">
            <h2 className="psk-font-display" style={styles.resultsTitle}>
              <Star size={18} style={{ color: "#FFD23F", marginRight: 6 }} fill="#FFD23F" />

            <ResultChips results={results} />

                  <Heart size={16} style={{ marginRight: 6 }} />
                  残す
                </button>
                <button type="button" onClick={closeResultsOverlay} style={styles.doneBtn} className="psk-font-display">
                  完了
                </button>
              </div>
            </div>
          </div>
          </div>
        </div>
      )}

      {/* 抽選設定 パネル */}
      {showSettingsOverlay && (
        <>
          <div style={styles.settingsBackdrop} onClick={closeSettingsOverlay} />
          <div
            className={`${settingsClosing ? "shrink-panel" : "grow-panel"} psk-font-body`}
            style={{
              ...styles.settingsPanel,
              left: `${settingsOrigin.left}px`,
              top: `${settingsOrigin.top}px`,
              width: `${settingsOrigin.width}px`,
              transformOrigin: settingsOrigin.openAbove ? "50% 100%" : "50% 0%",
            }}
          >
            <button type="button" onClick={closeSettingsOverlay} style={styles.settingsPanelClose} aria-label="設定を閉じる">
              <X size={18} color="#6B6685" />
            </button>
            <div style={styles.settingsPanelTitle} className="psk-font-display">
              <Settings2 size={15} style={{ marginRight: 6, color: "#4D8DFF" }} />
              抽選設定
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "12px", opacity: forcedDuplicate ? 0.85 : 1 }} className="psk-font-body">
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={styles.toggleLabel}>
                  キャラクターの重複を許可
                  {forcedDuplicate && <span style={styles.lockBadge}>固定中</span>}
                </div>
                <div style={styles.toggleSub}>同じキャラが複数回選ばれることがあるか</div>
                {forcedDuplicate && (
                  <div style={styles.lockNote}>抽選人数が抽選対象キャラクター数を超えているため固定されています</div>
                )}
              </div>
              <button
                type="button"
                role="switch"
                aria-checked={effectiveDuplicateOn}
                onClick={handleDuplicateToggle}
                disabled={forcedDuplicate}
                className="toggle-track"
                style={{ ...styles.toggleTrack, background: effectiveDuplicateOn ? "#3DDC97" : "#C9C5D8", cursor: forcedDuplicate ? "not-allowed" : "pointer" }}
              >
                <span className="toggle-knob" style={{ ...styles.toggleKnob, transform: effectiveDuplicateOn ? "translateX(20px)" : "translateX(0px)" }}>
                  {forcedDuplicate && <Lock size={11} color="#3DDC97" style={{ display: "block", margin: "2.5px" }} />}
                </span>
              </button>
            </div>
          </div>
        </>
      )}

      {/* リセット確認モーダル（2種類） */}
      {showResetConfirm && (
        <div style={styles.confirmOverlay}>
          <div style={styles.confirmCard} className="confirm-pop psk-font-body">
            <div style={styles.confirmTitle} className="psk-font-display">リセットの種類を選んでください</div>
            <div style={styles.confirmBody}>
              どちらのリセットを実行しますか？
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 14 }}>
              <button
                type="button"
                onClick={performResetExceptHistory}
                style={styles.resetOptionBtn}
                className="psk-font-display"
              >
                <div style={{ fontWeight: 800, marginBottom: 4 }}>履歴以外リセット</div>
                <div style={{ fontSize: 11.5, fontWeight: 500, color: "#6B6685", lineHeight: 1.4 }}>
                  人数・重複・キャラクター選択・必ず出すキャラを初期化します。<br />
                  <b style={{ color: "#2FBE84" }}>履歴・お気に入りは残ります</b>
                </div>
              </button>
              <button
                type="button"
                onClick={() => { setShowResetConfirm(false); setShowResetAllConfirm(true); }}
                style={{ ...styles.resetOptionBtn, ...styles.resetOptionDanger }}
                className="psk-font-display"
              >
                <div style={{ fontWeight: 800, marginBottom: 4, color: "#E1435F" }}>すべてリセット</div>
                <div style={{ fontSize: 11.5, fontWeight: 500, color: "#6B6685", lineHeight: 1.4 }}>
                  上記すべてに加えて、<b style={{ color: "#E1435F" }}>履歴・お気に入りも削除</b>します。<br />
                  この操作は取り消せません。
                </div>
              </button>
            </div>
            <button type="button" onClick={cancelResetConfirm} style={styles.confirmCancelBtn} className="psk-font-display">
              キャンセル
            </button>
          </div>
        </div>
      )}

      {/* すべてリセット 最終確認 */}
      {showResetAllConfirm && (
        <div style={styles.confirmOverlay}>
          <div style={styles.confirmCard} className="confirm-pop psk-font-body">
            <div style={{ ...styles.confirmTitle, color: "#E1435F" }} className="psk-font-display">本当にすべて削除しますか？</div>
            <div style={styles.confirmBody}>
              抽選人数・設定・キャラクター選択に加え、<b>履歴とお気に入りもすべて削除</b>されます。<br />
              この操作は取り消せません。
            </div>
            <div style={styles.confirmButtonRow}>
              <button
                type="button"
                onClick={() => setShowResetAllConfirm(false)}
                style={styles.confirmCancelBtn}
                className="psk-font-display"
              >
                キャンセル
              </button>
              <button
                type="button"
                onClick={() => { setShowResetAllConfirm(false); performResetAll(); }}
                style={styles.confirmResetBtn}
                className="psk-font-display"
              >
                すべて削除する
              </button>
            </div>
          </div>
        </div>
      )}

      {/* お気に入り保存モーダル */}
      {showSaveModal && (
        <div style={styles.confirmOverlay}>
          <div style={styles.confirmCard} className="confirm-pop psk-font-body">
            <div style={styles.confirmTitle} className="psk-font-display">お気に入りの名前を入力</div>
            {saveResultDuplicate && (
              <div style={styles.warnBox}>この抽選結果はすでに保存されています。</div>
            )}
            {saveNameDuplicate && (
              <div style={styles.warnBox}>この名前はすでに使用されています。保存すると番号が付きます。</div>
            )}
            <input
              ref={saveInputRef}
              type="text"
              value={saveNameInput}
              onChange={(e) => handleSaveNameChange(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") confirmSaveFavorite(); }}
              placeholder={saveDefaultName || "例：メインメンバー"}
              style={styles.saveNameInput}
              className="psk-font-body"
              maxLength={40}
            />
            <div style={{ fontSize: 11, color: "#9691AD", marginTop: -12, marginBottom: 14, lineHeight: 1.4 }}>
              何も入力せず保存すると、上の日時が名前になります
            </div>
            <div style={styles.confirmButtonRow}>
              <button type="button" onClick={cancelSaveModal} style={styles.confirmCancelBtn} className="psk-font-display">
                キャンセル
              </button>
              <button
                type="button"
                onClick={confirmSaveFavorite}
                style={{ ...styles.confirmResetBtn, ...styles.saveConfirmBtn }}
                className="psk-font-display"
              >
                保存
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 名前変更モーダル */}
      {renameTarget && (
        <div style={styles.confirmOverlay}>
          <div style={styles.confirmCard} className="confirm-pop psk-font-body">
            <div style={styles.confirmTitle} className="psk-font-display">名前を変更</div>
            {renameNameDuplicate && (
              <div style={styles.warnBox}>この名前はすでに使用されています。保存すると番号が付きます。</div>
            )}
            <input
              ref={renameInputRef}
              type="text"
              value={renameInput}
              onChange={(e) => handleRenameInputChange(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") confirmRename(); }}
              style={styles.saveNameInput}
              className="psk-font-body"
              maxLength={40}
            />
            <div style={styles.confirmButtonRow}>
              <button type="button" onClick={cancelRename} style={styles.confirmCancelBtn} className="psk-font-display">
                キャンセル
              </button>
              <button
                type="button"
                onClick={confirmRename}
                disabled={!renameInput.trim()}
                style={{ ...styles.confirmResetBtn, ...styles.saveConfirmBtn, opacity: renameInput.trim() ? 1 : 0.5 }}
                className="psk-font-display"
              >
                変更
              </button>
            </div>
          </div>
        </div>
      )}

      {/* トースト通知 */}
      <div style={styles.toastStack} aria-live="polite">
        {toasts.map((t) => (
          <div key={t.id} className="toast-item" style={styles.toastItem}>
            {t.message}
          </div>
        ))}
      </div>
    </div>
  );
}
